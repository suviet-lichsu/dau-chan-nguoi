    /**
     * =====================================================================
     * THÔNG BÁO TOAST NHẸ NHÀNG (KHÔNG DÙNG ALERT)
     * =====================================================================
     */
    function showToast(message, variant = 'moss') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        moss: 'bg-[#1B3B2B] text-[#FDFBF7] border-[#B45309]',
        error: 'bg-[#B91C1C] text-white border-amber-200',
        cream: 'bg-[#F5F0E6] text-[#1B3B2B] border-[#B45309]'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border-2 shadow-lg text-xs sm:text-sm font-semibold flex items-center gap-2.5 panel-fade ${styles[variant] || styles.moss}`;
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-[#F59E0B] shrink-0"></span>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    /**
     * =====================================================================
     * THANH ĐIỀU HƯỚNG 4 TAB ĐỘC LẬP
     * =====================================================================
     */
    function renderTabsBar() {
      const bar = document.getElementById('main-tabs-bar');
      if (!bar) return;

      bar.innerHTML = TABS.map(t => {
        const isActive = activeTab === t.id;
        return `
          <button type="button" onclick="switchTab('${t.id}')"
            class="px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all flex items-center gap-2 border ${
              isActive
                ? 'bg-[#1B3B2B] text-[#FDFBF7] border-[#1B3B2B] shadow-xs'
                : 'bg-white/90 text-[#1F2937] border-[#1B3B2B]/15 hover:bg-[#F5F0E6]'
            }">
            <span class="text-[11px] px-2 py-0.5 rounded-md font-extrabold ${
              isActive ? 'bg-[#B45309] text-white' : 'bg-[#F5F0E6] text-[#1B3B2B]'
            }">${t.num}</span>
            <span>${t.label}</span>
          </button>
        `;
      }).join('');
    }

    function switchTab(tabId) {
      activeTab = tabId;
      renderTabsBar();
      renderActiveTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderActiveTab() {
      const viewport = document.getElementById('tab-viewport');
      if (!viewport) return;

      if (activeTab === 'tab1') renderTab1Journey(viewport);
      else if (activeTab === 'tab2') renderTab2Artifacts(viewport);
      else if (activeTab === 'tab3') renderTab3Challenges(viewport);
      else if (activeTab === 'tab4') renderTab4PenNames(viewport);
    }

              <div class="museum-vitrine rounded-2xl p-4 sm:p-6">
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="px-3 py-1 rounded-full bg-[#1B3B2B] text-[#FDE68A] text-xs font-extrabold tracking-wider">
                    HIỆN VẬT ${currentArt.code}
                  </span>
                  <span class="text-[11px] font-bold uppercase tracking-widest text-[#B45309]">
                    Tủ Kính Trưng Bày
                  </span>
                </div>
                <div class="h-44 sm:h-52 w-full max-w-md mx-auto">
                  ${getArtifactSVG(currentArt.svgType)}
                </div>
              </div>

              <!-- Tiêu đề & 3 thẻ thông tin bảo tàng -->
              <div class="space-y-3">
                <h3 class="font-editorial text-2xl sm:text-3xl font-black text-[#1B3B2B] leading-snug">
                  ${currentArt.name}
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">

                    <span class="block text-xs sm:text-sm font-bold text-[#1B3B2B] mt-0.5">${currentArt.year}</span>
                  </div>

                    <span class="block text-[10px] font-bold uppercase tracking-wider text-[#B45309]">Chất liệu</span>
                    <span class="block text-xs sm:text-sm font-bold text-[#1B3B2B] mt-0.5">${currentArt.material}</span>
                  </div>
                  <div class="p-3 rounded-xl bg-[#F5F0E6] border border-[#1B3B2B]/10">

                    <span class="block text-xs sm:text-sm font-bold text-[#1B3B2B] mt-0.5">${currentArt.location}</span>

              <!-- 3 Tab con tương tác bên trong thẻ hiện vật -->
              <div class="space-y-3 pt-1">
                <div class="flex flex-wrap gap-1.5 bg-[#F5F0E6] p-1.5 rounded-2xl border border-[#1B3B2B]/12">
                  ${subTabs.map(st => {
                    const active = st.id === activeArtifactSubTab;
                    return `
                      <button type="button" onclick="setArtifactSubTab('${st.id}')"
                        class="flex-1 min-w-[125px] px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                          active
                            ? 'bg-[#B91C1C] text-white shadow-2xs'
                            : 'text-[#1B3B2B] hover:bg-white/75'
                        }">
                        ${st.label}
                      </button>
                    `;
                  }).join('')}
                </div>

                <div class="p-4 sm:p-5 rounded-2xl bg-[#FDFBF7] border border-[#B45309]/30 text-sm sm:text-base text-[#1F2937] leading-relaxed panel-fade">
                  ${activeSubObj.content}
                </div>
              </div>
            </article>
          </div>
        </section>
      `;
    }

    /**
     * =====================================================================
     * RENDER TAB 03: THỬ THÁCH SỬ VIỆT (NỐI MỐC LỊCH SỬ & TRẮC NGHIỆM 8 CÂU)
     * =====================================================================
     */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initMatchingGame(switchSet = false) {
      if (switchSet) {
        matchSetIdx = (matchSetIdx + 1) % MATCHING_SETS.length;
      }
      const currentSet = MATCHING_SETS[matchSetIdx];
      matchLeftList = shuffleArray(currentSet.pairs.map(p => ({ id: p.id, text: p.event })));
      matchRightList = shuffleArray(currentSet.pairs.map(p => ({ id: p.id, text: p.target })));
      selectedLeftId = null;
      selectedRightId = null;
      matchedIds = [];
      wrongFlashIds = [];
      lastMatchInsight = '';
    }

    function switchGameMode(mode) {
      activeGameMode = mode;
      renderTab3Challenges(document.getElementById('tab-viewport'));
    }

    function handleSelectLeft(id) {
      if (matchedIds.includes(id)) return;
      selectedLeftId = selectedLeftId === id ? null : id;
      checkMatchingPair();
      renderTab3Challenges(document.getElementById('tab-viewport'));
    }

    function handleSelectRight(id) {
      if (matchedIds.includes(id)) return;
      selectedRightId = selectedRightId === id ? null : id;
      checkMatchingPair();
      renderTab3Challenges(document.getElementById('tab-viewport'));
    }

    function checkMatchingPair() {
      if (!selectedLeftId || !selectedRightId) return;

      if (selectedLeftId === selectedRightId) {
        const pairObj = MATCHING_SETS[matchSetIdx].pairs.find(p => p.id === selectedLeftId);
        matchedIds.push(selectedLeftId);
        lastMatchInsight = pairObj ? `${pairObj.event} (${pairObj.target}): ${pairObj.info}` : '';
        selectedLeftId = null;
        selectedRightId = null;
        showToast('Chính xác! Cặp sự kiện và mốc lịch sử đã trùng khớp.', 'moss');
      } else {
        const lId = selectedLeftId;
        const rId = selectedRightId;
        wrongFlashIds = [lId, rId];
        selectedLeftId = null;
        selectedRightId = null;
        showToast('Chưa trùng khớp thời gian hoặc địa điểm — Hãy thử ghép lại nhé!', 'error');

        setTimeout(() => {
          wrongFlashIds = [];
          if (activeTab === 'tab3' && activeGameMode === 'matching') {
            renderTab3Challenges(document.getElementById('tab-viewport'));
          }
        }, 480);
      }
    }

    function restartMatchingGame(switchSet) {
      initMatchingGame(switchSet);
      showToast(switchSet ? `Đã chuyển sang ${MATCHING_SETS[matchSetIdx].title}` : 'Đã xáo trộn lại bảng nối mốc lịch sử!', 'cream');
      renderTab3Challenges(document.getElementById('tab-viewport'));
    }

    function selectQuizOption(optIdx) {
      if (quizSelectedOpt !== null) return;
      quizSelectedOpt = optIdx;
      const q = QUICK_QUIZ_QUESTIONS[quizIndex];
      if (optIdx === q.answerIdx) {
        quizScore += 1;
        showToast('Đáp án chính xác!', 'moss');
      } else {
        showToast('Chưa đúng — Xem giải thích kiến thức bên dưới nhé!', 'error');
      }
      renderTab3Challenges(document.getElementById('tab-viewport'));
    }

    function nextQuizQuestion() {
      if (quizIndex < QUICK_QUIZ_QUESTIONS.length - 1) {
        quizIndex += 1;
        quizSelectedOpt = null;
      } else {
        quizFinished = true;
      }
      renderTab3Challenges(document.getElementById('tab-viewport'));
    }

    function resetQuizGame() {
      quizIndex = 0;
      quizSelectedOpt = null;
      quizScore = 0;
      quizFinished = false;
      renderTab3Challenges(document.getElementById('tab-viewport'));
    }

    function renderTab3Challenges(container) {
      if (!container) return;
      const currentSet = MATCHING_SETS[matchSetIdx];

      container.innerHTML = `
        <section class="space-y-6 panel-fade">
          <!-- Tiêu đề & Nút chuyển đổi 2 chế độ chơi -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-[#1B3B2B]/15 pb-5">
            <div>
              <span class="text-xs font-bold uppercase tracking-widest text-[#B45309]">CHƯƠNG 03 • ÔN TẬP KIẾN THỨC TƯƠNG TÁC</span>
              <h2 class="font-editorial text-2xl sm:text-3xl font-black text-[#1B3B2B] mt-1">
                Thử Thách Sử Việt
              </h2>
            </div>

            <div class="inline-flex p-1.5 rounded-2xl bg-[#F5F0E6] border border-[#1B3B2B]/15 self-start md:self-auto">
              <button type="button" onclick="switchGameMode('matching')"
                class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                  activeGameMode === 'matching'
                    ? 'bg-[#1B3B2B] text-[#FDFBF7] shadow-xs'
                    : 'text-[#1F2937] hover:bg-white/75'
                }">
                Chế độ 1: Nối Mốc Lịch Sử
              </button>
              <button type="button" onclick="switchGameMode('quiz')"
                class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                  activeGameMode === 'quiz'
                    ? 'bg-[#1B3B2B] text-[#FDFBF7] shadow-xs'
                    : 'text-[#1F2937] hover:bg-white/75'
                }">
                Chế độ 2: Trắc Nghiệm Nhanh
              </button>
            </div>
          </div>

          ${activeGameMode === 'matching' ? `
            <!-- CHẾ ĐỘ 1: NỐI MỐC LỊCH SỬ -->
            <div class="bg-white rounded-3xl border border-[#1B3B2B]/15 p-5 sm:p-7 shadow-2xs space-y-5 panel-fade">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[#1B3B2B]/10">
                <div>
                  <span class="text-xs font-bold text-[#B45309] uppercase">${currentSet.title}</span>
                  <p class="text-xs sm:text-sm text-[#1F2937]/80 mt-0.5">
                    Chạm chọn <strong>1 sự kiện lịch sử</strong> ở cột trái và <strong>1 mốc thời gian / địa điểm</strong> tương ứng ở cột phải.
                  </p>
                </div>
                <div class="flex flex-wrap items-center gap-2 shrink-0">
                  <button type="button" onclick="restartMatchingGame(false)"
                    class="px-3.5 py-2 rounded-xl border border-[#1B3B2B]/25 text-xs font-bold text-[#1B3B2B] hover:bg-[#F5F0E6]">
                    Xáo trộn lại
                  </button>
                  <button type="button" onclick="restartMatchingGame(true)"
                    class="px-4 py-2 rounded-xl bg-[#B45309] hover:bg-[#92400e] text-white text-xs font-bold shadow-2xs">
                    ↻ Đổi bộ câu hỏi
                  </button>
                </div>
              </div>

              ${lastMatchInsight ? `
                <div class="p-3.5 rounded-2xl bg-[#F5F0E6] border-l-4 border-[#1B3B2B] text-xs sm:text-sm text-[#1F2937] panel-fade">
                  <strong class="text-[#1B3B2B]">✓ Ghi nhớ lịch sử:</strong> ${lastMatchInsight}
                </div>
              ` : ''}

              ${matchedIds.length === 6 ? `
                <div class="p-6 rounded-2xl bg-[#1B3B2B] text-[#FDFBF7] text-center space-y-3 panel-fade">
                  <h3 class="font-editorial text-xl sm:text-2xl font-bold text-[#FDE68A]">
                    Tuyệt Vời! Bạn Đã Nối Chính Xác Toàn Bộ Các Cặp Mốc Lịch Sử
                  </h3>
                  <p class="text-xs sm:text-sm text-[#FDFBF7]/85 max-w-xl mx-auto">
                    Hãy tiếp tục thử sức với bộ câu hỏi còn lại hoặc chuyển sang phần Trắc Nghiệm Nhanh Sử Việt.
                  </p>
                  <div class="pt-1 flex flex-wrap justify-center gap-2.5">
                    <button type="button" onclick="restartMatchingGame(true)"
                      class="px-4 py-2.5 rounded-xl bg-[#B45309] text-white text-xs sm:text-sm font-bold">
                      ↻ Đổi bộ câu hỏi
                    </button>
                    <button type="button" onclick="switchGameMode('quiz')"
                      class="px-4 py-2.5 rounded-xl bg-[#FDFBF7] text-[#1B3B2B] text-xs sm:text-sm font-bold">
                      Sang Trắc Nghiệm Nhanh →
                    </button>
                  </div>
                </div>
              ` : `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                  <!-- Cột trái: 6 Sự kiện lịch sử -->
                  <div class="space-y-2.5">
                    <div class="text-xs font-bold uppercase tracking-wider text-[#1B3B2B]/70 px-1">Cột Trái • Sự Kiện Lịch Sử</div>
                    ${matchLeftList.map(item => {
                      const isMatched = matchedIds.includes(item.id);
                      const isSelected = selectedLeftId === item.id;
                      const isWrong = wrongFlashIds.includes(item.id);
                      return `
                        <button type="button" onclick="handleSelectLeft('${item.id}')" ${isMatched ? 'disabled' : ''}
                          class="w-full text-left p-3.5 rounded-2xl border-2 text-xs sm:text-sm font-semibold leading-snug transition-all ${
                            isMatched
                              ? 'bg-[#F5F0E6] border-[#1B3B2B] text-[#1B3B2B] opacity-85 cursor-default'
                              : isWrong
                                ? 'bg-red-50 border-[#B91C1C] text-[#B91C1C] shake-gentle'
                                : isSelected
                                  ? 'bg-[#1B3B2B] text-[#FDFBF7] border-[#B45309] shadow-sm'
                                  : 'bg-[#FDFBF7] text-[#1F2937] border-[#1B3B2B]/15 hover:border-[#B45309]'
                          }">
                          <span class="flex items-center justify-between gap-2">
                            <span>${item.text}</span>
                            ${isMatched ? '<span class="text-xs font-extrabold text-[#1B3B2B] shrink-0">✓ Đã nối</span>' : ''}
                          </span>
                        </button>
                      `;
                    }).join('')}
                  </div>

                  <!-- Cột phải: 6 Mốc thời gian / Địa điểm -->
                  <div class="space-y-2.5">
                    <div class="text-xs font-bold uppercase tracking-wider text-[#B45309] px-1">Cột Phải • Thời Gian &amp; Địa Điểm</div>
                    ${matchRightList.map(item => {
                      const isMatched = matchedIds.includes(item.id);
                      const isSelected = selectedRightId === item.id;
                      const isWrong = wrongFlashIds.includes(item.id);
                      return `
                        <button type="button" onclick="handleSelectRight('${item.id}')" ${isMatched ? 'disabled' : ''}
                          class="w-full text-left p-3.5 rounded-2xl border-2 text-xs sm:text-sm font-bold leading-snug transition-all ${
                            isMatched
                              ? 'bg-[#F5F0E6] border-[#1B3B2B] text-[#1B3B2B] opacity-85 cursor-default'
                              : isWrong
                                ? 'bg-red-50 border-[#B91C1C] text-[#B91C1C] shake-gentle'
                                : isSelected
                                  ? 'bg-[#B45309] text-white border-[#1B3B2B] shadow-sm'
                                  : 'bg-white text-[#1B3B2B] border-[#B45309]/35 hover:border-[#1B3B2B]'
                          }">
                          <span class="flex items-center justify-between gap-2">
                            <span>${item.text}</span>
                            ${isMatched ? '<span class="text-xs font-extrabold text-[#1B3B2B] shrink-0">✓</span>' : ''}
                          </span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `}
            </div>
          ` : `
            <!-- CHẾ ĐỘ 2: TRẮC NGHIỆM NHANH SỬ VIỆT (8 CÂU) -->
            <div class="bg-white rounded-3xl border border-[#1B3B2B]/15 p-5 sm:p-8 shadow-2xs panel-fade">
              ${quizFinished ? `
                <div class="text-center max-w-xl mx-auto py-4 space-y-4">
                  <span class="inline-block px-3.5 py-1 rounded-full bg-[#F5F0E6] text-[#1B3B2B] text-xs font-bold border border-[#B45309]/35">
                    KẾT QUẢ ÔN TẬP TRẮC NGHIỆM
                  </span>
                  <h3 class="font-editorial text-2xl sm:text-3xl font-black text-[#1B3B2B]">
                    Bạn Trả Lời Đúng ${quizScore} / ${QUICK_QUIZ_QUESTIONS.length} Câu Hỏi
                  </h3>
                  <p class="text-sm text-[#1F2937]/85 leading-relaxed">
                    ${quizScore >= 7
                      ? 'Xuất sắc! Bạn nắm rất vững các cột mốc cuộc đời, kỷ vật bảo tàng và tên gọi lịch sử của Chủ tịch Hồ Chí Minh.'
                      : quizScore >= 5
                        ? 'Khá tốt! Bạn đã ghi nhớ nhiều sự kiện lịch sử tiêu biểu, hãy thử chơi lại để chinh phục trọn vẹn cả 8 câu nhé.'
                        : 'Cảm ơn bạn đã tham gia ôn tập! Hãy khám phá thêm các chuyên mục trong ấn phẩm rồi thử sức lại nhé.'}
                  </p>
                  <div class="pt-2 flex flex-wrap justify-center gap-3">
                    <button type="button" onclick="resetQuizGame()"
                      class="px-5 py-3 rounded-xl bg-[#1B3B2B] hover:bg-[#12291E] text-[#FDFBF7] text-xs sm:text-sm font-bold">
                      Chơi lại trắc nghiệm
                    </button>
                    <button type="button" onclick="switchTab('tab4')"
                      class="px-5 py-3 rounded-xl bg-[#B45309] hover:bg-[#92400e] text-white text-xs sm:text-sm font-bold">
                      Xem Bút Danh &amp; Tên Gọi →
                    </button>
                  </div>
                </div>
              ` : (() => {
                const q = QUICK_QUIZ_QUESTIONS[quizIndex];
                const letters = ['A', 'B', 'C', 'D'];
                return `
                  <div class="space-y-5">
                    <div class="flex items-center justify-between gap-2 text-xs font-bold border-b border-[#1B3B2B]/10 pb-3">
                      <span class="text-[#B45309] uppercase tracking-wider">CÂU HỎI ${quizIndex + 1} / ${QUICK_QUIZ_QUESTIONS.length}</span>
                      <button type="button" onclick="resetQuizGame()" class="text-[#1B3B2B] hover:underline">
                        Chơi lại từ đầu
                      </button>
                    </div>

                    <h3 class="font-editorial text-lg sm:text-xl font-bold text-[#1B3B2B] leading-relaxed">
                      ${q.q}
                    </h3>

                    <div class="space-y-2.5">
                      ${q.options.map((optText, idx) => {
                        const answered = quizSelectedOpt !== null;
                        const isPicked = quizSelectedOpt === idx;
                        const isRight = q.answerIdx === idx;

                        let btnCls = 'bg-[#FDFBF7] border-[#1B3B2B]/15 hover:border-[#1B3B2B] text-[#1F2937]';
                        if (answered) {
                          if (isRight) btnCls = 'bg-[#F5F0E6] border-[#1B3B2B] text-[#1B3B2B] ring-2 ring-[#1B3B2B]/20';
                          else if (isPicked) btnCls = 'bg-red-50 border-[#B91C1C] text-[#B91C1C]';
                          else btnCls = 'bg-white border-slate-200 text-slate-400';
                        }

                        return `
                          <button type="button" onclick="selectQuizOption(${idx})" ${answered ? 'disabled' : ''}
                            class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start gap-3 ${btnCls}">
                            <span class="w-7 h-7 rounded-lg text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5 ${
                              answered && isRight
                                ? 'bg-[#1B3B2B] text-[#FDE68A]'
                                : answered && isPicked
                                  ? 'bg-[#B91C1C] text-white'
                                  : 'bg-[#F5F0E6] text-[#1B3B2B]'
                            }">
                              ${letters[idx]}
                            </span>
                            <span class="text-xs sm:text-sm font-semibold leading-relaxed">${optText}</span>
                          </button>
                        `;
                      }).join('')}
                    </div>

                    ${quizSelectedOpt !== null ? `
                      <div class="p-4 rounded-2xl border ${
                        quizSelectedOpt === q.answerIdx
                          ? 'bg-[#F5F0E6] border-[#1B3B2B]/30 text-[#1F2937]'
                          : 'bg-red-50 border-[#B91C1C]/30 text-[#1F2937]'
                      } space-y-3 panel-fade">
                        <div class="text-xs sm:text-sm leading-relaxed">
                          <strong class="${quizSelectedOpt === q.answerIdx ? 'text-[#1B3B2B]' : 'text-[#B91C1C]'}">
                            ${quizSelectedOpt === q.answerIdx ? '✓ Chính xác!' : `✕ Đáp án đúng là ${letters[q.answerIdx]}.`}
                          </strong>
                          ${q.explain}
                        </div>
                        <div class="flex justify-end">
                          <button type="button" onclick="nextQuizQuestion()"
                            class="px-5 py-2.5 rounded-xl bg-[#1B3B2B] hover:bg-[#12291E] text-[#FDFBF7] text-xs sm:text-sm font-bold">
                            ${quizIndex < QUICK_QUIZ_QUESTIONS.length - 1 ? 'Câu tiếp theo →' : 'Xem Kết Quả Tổng Kết →'}
                          </button>
                        </div>
                      </div>
                    ` : ''}
                  </div>
                `;
              })()}
            </div>
          `}
        </section>
      `;
    }

    /**
     * =====================================================================
     * TRIỆN DẤU THƯ PHÁP SVG RIÊNG CHO TỪNG TÊN GỌI & BÚT DANH (TAB 04)
     * =====================================================================
     */
    function getPenNameSealSVG(pen) {
      return `
        <svg viewBox="0 0 180 180" class="w-36 h-36 sm:w-40 sm:h-40 mx-auto select-none" aria-hidden="true">
          <!-- Nền giấy cổ và vòng hào quang đồng -->
          <circle cx="90" cy="90" r="84" fill="#F5F0E6" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>
          <!-- Khung triện đỏ son truyền thống -->
          <rect x="26" y="26" width="128" height="128" rx="14" fill="#B91C1C" stroke="#991B1B" stroke-width="2.5"/>
          <rect x="33" y="33" width="114" height="114" rx="10" fill="none" stroke="#FDE68A" stroke-width="1.4" opacity="0.88"/>
          <!-- Họa tiết góc triện -->
          <circle cx="42" cy="42" r="2" fill="#FDE68A"/>
          <circle cx="138" cy="42" r="2" fill="#FDE68A"/>
          <circle cx="42" cy="138" r="2" fill="#FDE68A"/>
          <circle cx="138" cy="138" r="2" fill="#FDE68A"/>
          <!-- Ngôi sao nhỏ phía trên triện -->
          <polygon points="90,41 92.2,47.2 98.8,47.2 93.5,51 95.5,57.2 90,53.4 84.5,57.2 86.5,51 81.2,47.2 87.8,47.2" fill="#FDE68A"/>
          <!-- Chữ thư pháp khắc trên triện -->
          <text x="90" y="81" text-anchor="middle" fill="#FDFBF7" font-family="Merriweather, serif" font-weight="900" font-size="14.5" letter-spacing="1.2">
            ${pen.sealTop}
          </text>
          <text x="90" y="105" text-anchor="middle" fill="#FDE68A" font-family="Merriweather, serif" font-weight="900" font-size="15.5" letter-spacing="1.2">
            ${pen.sealBottom}
          </text>
          <line x1="48" y1="117" x2="132" y2="117" stroke="#FDE68A" stroke-width="1" opacity="0.75"/>
          <text x="90" y="133" text-anchor="middle" fill="#FDFBF7" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="8.5" letter-spacing="1">
            ${pen.sealSub}
          </text>
        </svg>
      `;
    }

    /**
     * =====================================================================
     * RENDER TAB 04: BÚT DANH & TÊN GỌI (CHỈ GIẢI MÃ 7 TÊN GỌI LỊCH SỬ)
     * =====================================================================
     */
    function selectPenName(pnId) {
      selectedPenNameId = pnId;
      renderTab4PenNames(document.getElementById('tab-viewport'));
    }

    function renderTab4PenNames(container) {
      if (!container) return;

      const currentPen = HISTORICAL_PEN_NAMES.find(p => p.id === selectedPenNameId) || HISTORICAL_PEN_NAMES[0];

      container.innerHTML = `
        <section class="space-y-6 panel-fade">
          <!-- Tiêu đề Chương 04 -->
          <div class="border-b border-[#1B3B2B]/15 pb-4">
            <span class="text-xs font-bold uppercase tracking-widest text-[#B45309]">CHƯƠNG 04 • HỒ SƠ DANH XƯNG &amp; BÚT DANH CÁCH MẠNG</span>
            <h2 class="font-editorial text-2xl sm:text-3xl font-black text-[#1B3B2B] mt-1">
              Bút Danh &amp; Tên Gọi Lịch Sử
            </h2>
          </div>

          <!-- Lưới chọn 7 tên gọi và bút danh lịch sử -->
          <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2.5">
            ${HISTORICAL_PEN_NAMES.map(pn => {
              const isSelected = pn.id === currentPen.id;
              return `
                <button type="button" onclick="selectPenName('${pn.id}')"
                  class="text-left p-3.5 rounded-2xl border-2 transition-all flex flex-col justify-between gap-2 ${
                    isSelected
                      ? 'bg-[#1B3B2B] text-[#FDFBF7] border-[#B45309] shadow-md'
                      : 'bg-white text-[#1F2937] border-[#1B3B2B]/14 hover:border-[#B45309] hover:bg-[#F5F0E6]/60'
                  }">
                  <span class="text-xs font-extrabold ${isSelected ? 'text-[#FDE68A]' : 'text-[#B91C1C]'}">
                    ${pn.periodBadge}
                  </span>
                  <div>
                    <span class="font-editorial text-xs sm:text-sm font-bold leading-snug block ${
                      isSelected ? 'text-[#FDFBF7]' : 'text-[#1B3B2B]'
                    }">
                      ${pn.name}
                    </span>
                    <span class="text-[10px] mt-1 block leading-tight ${
                      isSelected ? 'text-[#FDFBF7]/75' : 'text-[#1F2937]/65'
                    }">
                      ${pn.roleTag}
                    </span>
                  </div>
                </button>
              `;
            }).join('')}
          </div>

          <!-- Khung Hồ Sơ Giải Mã Tên Gọi trang trọng -->
          <article class="rounded-3xl bg-white border-2 border-[#1B3B2B]/18 p-5 sm:p-8 shadow-sm space-y-6 panel-fade">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center border-b border-[#1B3B2B]/12 pb-6">
              <!-- Cột trái: Triện dấu thư pháp SVG riêng cho từng tên -->
              <div class="lg:col-span-4 flex flex-col items-center justify-center p-4 rounded-2xl bg-[#FDFBF7] border border-[#B45309]/25">
                ${getPenNameSealSVG(currentPen)}
                <span class="mt-2.5 text-[11px] font-bold uppercase tracking-widest text-[#B45309]">
                  Triện Dấu Danh Xưng
                </span>
              </div>

              <!-- Cột phải: Tiêu đề danh xưng & Giai đoạn sử dụng -->
              <div class="lg:col-span-8 space-y-3.5">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-3 py-1 rounded-full bg-[#B91C1C] text-white text-xs font-bold">
                    ${currentPen.roleTag}
                  </span>
                  <span class="px-3 py-1 rounded-full bg-[#F5F0E6] text-[#1B3B2B] text-xs font-bold border border-[#B45309]/35">
                    Mốc thời gian: ${currentPen.periodBadge}
                  </span>
                </div>

                <h3 class="font-editorial text-2xl sm:text-4xl font-black text-[#1B3B2B]">
                  ${currentPen.name}
                </h3>

                <div class="p-4 rounded-2xl bg-[#F5F0E6] border-l-4 border-[#B45309]">
                  <span class="block text-[11px] font-extrabold uppercase tracking-wider text-[#B45309]">
                    Giai đoạn sử dụng
                  </span>
                  <p class="text-xs sm:text-sm font-semibold text-[#1B3B2B] mt-1 leading-relaxed">
                    ${currentPen.usagePeriod}
                  </p>
                </div>
              </div>
            </div>

            <!-- 3 khung giải mã chi tiết: Hoàn cảnh ra đời, Ý nghĩa tên gọi & Dấu ấn lịch sử -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-5">
              <div class="p-5 rounded-2xl bg-[#FDFBF7] border border-[#1B3B2B]/14 space-y-2">
                <span class="text-xs font-extrabold uppercase tracking-wider text-[#B45309] block">
                  1. Hoàn cảnh ra đời
                </span>
                <p class="text-xs sm:text-sm text-[#1F2937] leading-relaxed">
                  ${currentPen.originContext}
                </p>
              </div>

              <div class="p-5 rounded-2xl bg-[#F5F0E6] border border-[#B45309]/30 space-y-2">
                <span class="text-xs font-extrabold uppercase tracking-wider text-[#1B3B2B] block">
                  2. Ý nghĩa tên gọi
                </span>
                <p class="text-xs sm:text-sm text-[#1F2937] leading-relaxed">
                  ${currentPen.nameMeaning}
                </p>
              </div>

              <div class="p-5 rounded-2xl bg-[#FDFBF7] border border-[#1B3B2B]/14 space-y-2">
                <span class="text-xs font-extrabold uppercase tracking-wider text-[#B91C1C] block">
                  3. Dấu ấn lịch sử gắn liền
                </span>
                <p class="text-xs sm:text-sm text-[#1F2937] leading-relaxed">
                  ${currentPen.historicalImprint}
                </p>
              </div>
            </div>
          </article>
        </section>
      `;
    }

    /**
     * =====================================================================
     * KHỞI TẠO CHUYÊN SAN KHI TẢI TRANG
     * =====================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      initMatchingGame(false);
      renderTabsBar();
      renderActiveTab();
    });
  </script>
</body>
</html>
